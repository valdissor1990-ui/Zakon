name: Content checks
on:
  push:
    paths: ["content/**", "agent/**", ".github/workflows/content-check.yml", ".github/workflows/content-release.yml"]
  pull_request:
    paths: ["content/**", "agent/**", ".github/workflows/content-check.yml", ".github/workflows/content-release.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: content-check-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture-evidence:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/content/populate-core-acts'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout intake branch
        uses: actions/checkout@v7
        with:
          ref: content/populate-core-acts
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Capture allowlisted official source originals
        run: |
          set -euo pipefail
          python agent/capture_sources.py --records content/intake/source-requests.json --output content/evidence
      - name: Synchronize metadata from this capture run and verify exact originals
        run: |
          set -euo pipefail
          python agent/sync_capture_metadata.py \
            --records content/intake/source-requests.json \
            --report content/evidence/capture-report.json \
            --evidence content/evidence
      - name: Commit captured originals to intake branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/evidence content/intake/source-requests.json
          if git diff --cached --quiet; then
            echo "No evidence changes to commit."
            exit 0
          fi
          git commit -m "content: capture official source evidence for law 63-FZ"
          for attempt in 1 2 3 4 5; do
            git fetch origin content/populate-core-acts
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              echo "Concurrent branch changes conflict with captured evidence; refusing a non-fast-forward or force push."
              exit 1
            fi
            if git push origin HEAD:refs/heads/content/populate-core-acts; then
              exit 0
            fi
            echo "Branch moved during push attempt $attempt/5; retrying after fetch/rebase."
            sleep "$((attempt * 2))"
          done
          echo "Unable to push captured evidence after five fetch/rebase attempts."
          exit 1


  extract-review-candidates:
    needs: capture-evidence
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/content/populate-core-acts'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout intake branch
        uses: actions/checkout@v7
        with:
          ref: content/populate-core-acts
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Extract captured DOCX and RTF into review-only text
        run: python agent/extract_source_text.py
      - name: Commit extracted review candidates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/extracted content/intake/source-requests.json
          if git diff --cached --quiet; then
            echo "No extraction changes."
            exit 0
          fi
          git commit -m "content: extract captured official texts for review"
          for attempt in 1 2 3 4 5; do
            git fetch origin content/populate-core-acts
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              echo "Concurrent branch changes conflict with extracted review candidates; refusing a non-fast-forward or force push."
              exit 1
            fi
            if git push origin HEAD:refs/heads/content/populate-core-acts; then
              exit 0
            fi
            echo "Branch moved during push attempt $attempt/5; retrying after fetch/rebase."
            sleep "$((attempt * 2))"
          done
          echo "Unable to push extracted review candidates after five fetch/rebase attempts."
          exit 1

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile agent/*.py
      - name: Validate workflow YAML syntax
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.{yml,yaml}").sort.each { |file| YAML.parse_file(file); puts "YAML OK: #{file}" }'
      - name: Check content tooling
        run: |
          python agent/validate_source_registry.py
          python agent/validate_catalog.py
          python agent/build_database.py --help
      - name: Run content pipeline regression tests
        run: python -m unittest discover -s agent -p "test_*.py"
      - name: Check SQLite schema and full-text triggers
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = sqlite3.connect(":memory:")
          db.execute("PRAGMA foreign_keys=ON")
          db.executescript(Path("content/schema/schema.sql").read_text(encoding="utf-8"))

          source_id = db.execute("""
              INSERT INTO sources(name,publisher,official_url,source_type,retrieved_at,sha256)
              VALUES(?,?,?,?,?,?) RETURNING id
          """, ("Тестовый источник", "Государственный орган", "https://example.gov.ru/test",
                "test", "2026-11-06T00:00:00Z", "a" * 64)).fetchone()[0]

          db.execute("""
              INSERT INTO documents(id,title,document_type,legal_status,source_id,
                                    verification_status,text_sha256)
              VALUES(?,?,?,?,?,?,?)
          """, ("test-doc", "Тестовый документ", "test", "действует",
                source_id, "approved", "b" * 64))

          db.execute("""
              INSERT INTO articles(id,document_id,ordinal,number,title,body)
              VALUES(?,?,?,?,?,?)
          """, ("test-article", "test-doc", 1, "1", "Общие положения",
                "Тестовая конституция России"))

          found = db.execute(
              "SELECT article_id FROM articles_fts WHERE articles_fts MATCH ?",
              ("конституция",)
          ).fetchall()
          assert found == [("test-article",)], f"FTS insert trigger failed: {found}"

          db.execute("UPDATE articles SET body=? WHERE id=?",
                     ("Обновлённый правовой текст", "test-article"))
          old_hits = db.execute(
              "SELECT article_id FROM articles_fts WHERE articles_fts MATCH ?",
              ("конституция",)
          ).fetchall()
          new_hits = db.execute(
              "SELECT article_id FROM articles_fts WHERE articles_fts MATCH ?",
              ("обновлённый",)
          ).fetchall()
          assert not old_hits and new_hits == [("test-article",)], "FTS update trigger failed"

          db.execute("UPDATE documents SET title=? WHERE id=?",
                     ("Новое название", "test-doc"))
          db.execute("DELETE FROM articles WHERE id=?", ("test-article",))
          remaining = db.execute(
              "SELECT count(*) FROM articles_fts WHERE article_id=?",
              ("test-article",)
          ).fetchone()[0]
          assert remaining == 0, "FTS delete trigger failed"

          assert db.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
          print("SQLite schema, foreign keys, FTS insert/update/delete triggers: OK")
          PY
