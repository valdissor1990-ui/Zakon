name: Android CI (debug artifact only)
on:
  push:
    paths: ["app/**", "*.gradle.kts", "gradle.properties", ".github/workflows/android-build.yml"]
  pull_request:
    paths: ["app/**", "*.gradle.kts", "gradle.properties"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
      - name: Run Android tests, lint and build
        run: gradle testDebugUnitTest lintDebug assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Zakon-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: zakon-debug-apk
          path: Zakon-debug.apk
