name: Android debug build
on:
  push:
    paths: ["app/**", "*.gradle.kts", "gradle.properties", ".github/workflows/android-build.yml"]
  pull_request:
    paths: ["app/**", "*.gradle.kts", "gradle.properties"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
      - name: Run Android tests, lint and build
        run: gradle testDebugUnitTest lintDebug assembleDebug
      - name: Run database migration tests on Android 8 (API 26)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          profile: pixel_2
          script: gradle connectedDebugAndroidTest
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Zakon-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: zakon-debug-apk
          path: Zakon-debug.apk
      - name: Publish APK to Release (direct .apk, no zip)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Zakon debug APK
          body: "Прямая загрузка APK без ZIP.\n\nКоммит: ${{ github.sha }}"
          files: Zakon-debug.apk
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
